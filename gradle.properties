org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Keep the app installed after an instrumentation run.
#
# connectedAndroidTest UNINSTALLS the app when it finishes, which on a real Karoo takes
# shared_prefs with it: test mode, both HUD slots and the zone pill's source all go back to
# their defaults, and the next `adb install -r` is then a first install rather than an update.
# It looks like the app is losing its settings on every install; it is the test run doing it.
#
# The uid is the tell -- it changes across an uninstall/install and survives an update.
android.injected.androidTest.leaveApksInstalledAfterRun=true
